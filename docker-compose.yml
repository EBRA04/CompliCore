services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: complicore
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d complicore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
